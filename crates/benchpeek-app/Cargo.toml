[package]
name = "benchpeek-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "benchpeek"
path = "src/main.rs"

[dependencies]
benchpeek-core = { path = "../benchpeek-core" }
benchpeek-plugin = { path = "../benchpeek-plugin" }
benchpeek-wasm-host = { path = "../benchpeek-wasm-host" }
ascii-kv = { path = "../../plugins/ascii-kv" }
can-raw = { path = "../../plugins/can-raw" }
anyhow = "1"
fastrand = "2"
serialport = "4"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = "0.36.1"
egui_plot = "0.37.0"
socketcan = { version = "4.0.0", features = ["enumerate"] }
nusb = "0.2.7"
env_logger = "0.11"
log = "0.4"

image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned to what gbm 0.15 itself depends on (drm 0.12), so BufferObject
# actually implements this crate's own `drm::buffer::Buffer` trait instead
# of Cargo unifying two incompatible `drm` majors in the dependency graph.
drm = "0.12"
gbm = "0.15"
glow = "0.17"
glutin = "0.32"
egui_glow = "0.36.1"
raw-window-handle = "0.6.2"
evdev = "0.13.2"
